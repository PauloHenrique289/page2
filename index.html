<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabela de Classificação</title>
<style>
:root {
  --bg: #f5f7f2; --card: #fff; --ink: #16241b; --line: #d6dfd3; --head: #1f6b3a;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1a13; --card: #16241b; --ink: #e9efe6; --line: #2b3d31; }
}
body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
main { max-width: 600px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin: 0 0 16px; }
.wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
table { width: 100%; border-collapse: collapse; }
th { background: var(--head); color: #fff; }
th, td { padding: 10px; text-align: center; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
.time { text-align: left; }
td.time { font-weight: 600; }
tbody tr:first-child td { background: color-mix(in srgb, var(--head) 15%, transparent); }
</style>
</head>
<body>
<main>
  <h1>⚽ Tabela de Classificação</h1>
  <div class="wrap">
    <table>
      <thead>
        <tr><th>#</th><th class="time">Time</th><th>J</th><th>V</th><th>E</th><th>D</th><th>Pts</th></tr>
      </thead>
      <tbody id="corpo"></tbody>
    </table>
  </div>
</main>

<script>
const times = [
  { nome: "Atlético Vila Nova", v: 18, e: 6, d: 4 },
  { nome: "Esporte Clube Porto", v: 17, e: 5, d: 6 },
  { nome: "Real Estrela", v: 15, e: 8, d: 5 },
  { nome: "União da Serra", v: 14, e: 7, d: 7 },
  { nome: "Racing do Vale", v: 11, e: 8, d: 9 },
  { nome: "Operário Central", v: 6, e: 8, d: 14 }
];

times.forEach(t => { t.j = t.v + t.e + t.d; t.pts = t.v * 3 + t.e; });
times.sort((a, b) => b.pts - a.pts);

document.getElementById("corpo").innerHTML = times.map((t, i) => `
  <tr>
    <td>${i + 1}</td>
    <td class="time">${t.nome}</td>
    <td>${t.j}</td><td>${t.v}</td><td>${t.e}</td><td>${t.d}</td>
    <td><strong>${t.pts}</strong></td>
  </tr>`).join("");
</script>
</body>
</html>
